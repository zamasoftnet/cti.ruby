name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # RubyGems の Trusted Publishing(OIDC)に必要
    steps:
      - uses: actions/checkout@v4

      # actions/setup-ruby は保管庫入りなので ruby/setup-ruby を使う。
      # Trusted Publishing には新しめの RubyGems が必要
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Generate API docs
        run: rdoc -N -c UTF-8 -o build/apidoc -m CTI src/code 2>/dev/null || true

      - name: Create dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIRNAME="cti-ruby-${VERSION}"
          STAGEDIR="build/${DIRNAME}"
          mkdir -p "${STAGEDIR}"
          cp -r build/apidoc "${STAGEDIR}/apidoc" 2>/dev/null || true
          cp -r src/. "${STAGEDIR}/"
          rm -rf "${STAGEDIR}/test/out"
          sed "s/@version@/${VERSION}/g" README.md > "${STAGEDIR}/README.md"
          # Create archives
          cd build
          zip -r "${DIRNAME}.zip" "${DIRNAME}"
          tar czf "${DIRNAME}.tar.gz" "${DIRNAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/cti-ruby-*.zip
            build/cti-ruby-*.tar.gz

      # RubyGems.org への公開(Trusted Publishing。長期の API 鍵をリポジトリに置かない)。
      # 使うには rubygems.org 側で publisher を登録すること(PUBLISHING.md)。
      # 登録前に走ると失敗するので、リポジトリ変数 RUBYGEMS_TRUSTED_PUBLISHING が true のときだけ動かす。
      - name: Configure RubyGems credentials (Trusted Publishing)
        if: vars.RUBYGEMS_TRUSTED_PUBLISHING == 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build and push the gem
        if: vars.RUBYGEMS_TRUSTED_PUBLISHING == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gem build copper-cti.gemspec -o "copper-cti-${VERSION}.gem"
          gem push "copper-cti-${VERSION}.gem"

      - name: Deploy API docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/apidoc
